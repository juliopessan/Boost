version: "3.9"

services:
  webhook:
    build:
      context: ./webhook
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - AWS_REGION=us-east-1
    depends_on:
      - localstack
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: boost
      POSTGRES_USER: boost
      POSTGRES_PASSWORD: boost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  redis_data:
  localstack_data:
  postgres_data:
